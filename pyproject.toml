[project]
name = "margin-guard"
version = "0.1.0"
description = "Coordinated agents that protect quoted margin when supplier costs move."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.107",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The repo root also holds frontend/, data/ and tests/, so name the packages
# explicitly instead of letting setuptools guess (it refuses to).
[tool.setuptools]
packages = ["margin_guard", "evals"]

[tool.setuptools.package-data]
margin_guard = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
